name: Integrate Reel Composer UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-reel-ui.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Reel Composer bundle to app shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/app/index.html')
          s=p.read_text()
          tag='<script src="reel-integrated.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "snipoclips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app/index.html
          git commit -m "Show AI Reel Composer in main dashboard"
          git push
