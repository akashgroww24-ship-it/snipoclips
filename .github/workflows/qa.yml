name: Snipoclip QA

on:
  pull_request:
    branches: [main]
  push:
    branches: ["automation/**", "staging"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check lib/pipeline.js
          node --check routes/clips.js
      - name: Unit tests
        run: npm test
      - name: Static checks
        run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@latest
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        env:
          BASE_URL: https://snipoclips.onrender.com
        run: npx playwright test tests/e2e/smoke.spec.js --project=chromium
