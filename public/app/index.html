    <div class="chip"><span class="coin"></span><b id="mins">—</b> min</div>
    <button class="btn ghost" id="out">Sign out</button>
    <button class="btn prim" onclick="location.href='/pricing'">Upgrade</button>
    <div class="av" id="av">?</div>
  </div>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<main class="wrap">
  <h1 class="sr">Create clips from a long video</h1>

  <section class="stage">
    <div class="wm" aria-hidden="true">Snipo Clips</div>

    <div class="hero">
      <div class="hero-in">
        <button class="hero-x" id="hero-x" aria-label="Hide">&times;</button>
        <h2>Open Clips</h2>
        <p class="sub">Drop a video link below to get your clips</p>

        <div class="seg" role="tablist">
          <button id="t-url" class="on" role="tab" aria-selected="true">Paste link</button>
          <button id="t-file" role="tab" aria-selected="false">Upload file</button>
        </div>

        <div class="row">
          <label class="field" id="f-url">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
            <input id="url" type="url" placeholder="Drop a video link…" autocomplete="off">
          </label>
          <div class="drop" id="drop" style="display:none" tabindex="0" role="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 15V4m-4 4 4-4 4 4"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            <span id="drop-txt">Choose a video · up to 1GB</span>
            <input type="file" id="file" accept="video/*" hidden>
          </div>
          <button class="btn prim go" id="go">Get clips in 1 click</button>
        </div>

        <div class="opts">
          <button class="opt-btn" id="opt-btn" aria-expanded="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            Options
          </button>
          <span class="opt-count" id="opt-count">2 on</span>
        </div>
        <div class="panel" id="panel">
          <select class="sel" id="ratio"><option value="9:16">9:16 Reels</option><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="16:9">16:9</option></select>
          <select class="sel" id="duration"><option value="auto">Auto length</option><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select>
          <select class="sel" id="count"><option value="">Auto count</option><option>4</option><option>6</option><option>8</option><option>10</option><option>12</option></select>
          <select class="sel" id="captionStyle"><option value="classic">Yellow highlight</option><option value="white">Clean white</option><option value="green">Mint</option><option value="pink">Pink</option></select>
          <select class="sel" id="language"><option value="auto">Auto-detect</option><option value="hi">Hindi</option><option value="en">English</option></select>
          <span id="pills" style="display:contents"></span>
        </div>
      </div>
    </div>

    <div class="tools">
      <button class="arw" id="pv" aria-label="Scroll left">‹</button>
      <div class="track" id="track"><button class="tool" aria-pressed="1"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M17 4v16M7 9h10M7 15h10"/></svg><b>Long to shorts</b></button><button class="tool" aria-pressed="0"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM8 10h8M8 14h5"/></svg><b>AI Captions</b></button><button class="tool" aria-pressed="0"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm10 16-4.2-4.2"/></svg><b>Find moments</b></button><button class="tool" aria-pressed="0"><span class="new">NEW</span><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M8 8l4-5 4 5M5 16c0 3 3 5 7 5s7-2 7-5"/></svg><b>Hinglish</b></button><button class="tool" aria-pressed="0"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v12H3zm6 0v12"/></svg><b>AI B-roll</b></button><button class="tool" aria-pressed="0"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10v4M10 6v12M14 8v8M18 11v2"/></svg><b>Enhance audio</b></button></div>
      <button class="arw" id="nx" aria-label="Scroll right">›</button>
    </div>

    <div class="proc" id="proc" aria-live="polite">
      <h3 id="proc-t">Analyzing your video…</h3>
      <div class="now" id="proc-n">Just started</div>
      <div class="pbar"><i id="proc-b"></i></div>
      <div class="steps" id="proc-s"></div>
    </div>
  </section>

  <section class="sec" id="projects" style="position:relative">
    <div class="sec-h">
      <h2>All projects</h2><span class="tagp">All</span>
      <div class="sec-r">
        <div class="ctl" id="sort">Newest <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m1 1 4 4 4-4"/></svg></div>
        <label class="ctl"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search"></label>
      </div>
    </div>
    <div class="grid" id="grid">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <span class="spark" aria-hidden="true">✦</span>
  </section>
</main>

</div></div>

<button class="fab" id="help" aria-label="Help">💬</button>

<script src="app.js"></script>
</body>
</html>
