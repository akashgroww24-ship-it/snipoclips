<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snipo Music — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#08060e;color:#f6f2ff;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 0,rgba(168,85,247,.16),transparent 35%),radial-gradient(circle at 90% 20%,rgba(236,72,153,.09),transparent 32%)}.shell{max-width:1180px;margin:auto;padding:28px 22px 70px;position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800;font-size:20px}.top a{color:#bdaed2;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:20px}.panel{background:rgba(18,12,29,.86);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px}.eyebrow{font-size:10px;color:#d46bf6;letter-spacing:.14em;font-weight:800;text-transform:uppercase}.panel h1,.panel h2{margin:8px 0 8px}.sub{color:#958aa8;font-size:11px;line-height:1.6}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:9px;font-weight:800;color:#9c91ad}.field input,.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b0812;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:#a855f7}.checks{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}.checks label{font-size:10px;color:#b7abc6}.cta{grid-column:1/-1;padding:12px;border:0;border-radius:11px;background:linear-gradient(90deg,#a855f7,#e549c8);color:#fff;font-weight:800;cursor:pointer}.cta:disabled{opacity:.5}.notice{display:none;margin-top:12px;padding:10px;border-radius:10px;font-size:10px}.notice.on{display:block}.notice.ok{background:rgba(34,197,94,.1);color:#9be3ae}.notice.err{background:rgba(239,68,68,.1);color:#ffb3b3}.tools{display:flex;gap:8px;margin:12px 0}.tools input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#0b0812;color:white}.count{font-size:10px;color:#82768f}.list{display:grid;gap:9px;max-height:680px;overflow:auto}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:#0c0912}.row strong{font-size:11px}.meta{font-size:9px;color:#8e829e;margin-top:4px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.badge{font-size:8px;border-radius:999px;padding:3px 6px;background:rgba(168,85,247,.1);color:#cba8e7}.disable{border:1px solid rgba(255,255,255,.08);background:#15101d;color:#bcafc9;border-radius:8px;padding:7px 9px;font-size:9px;cursor:pointer}.empty{padding:30px;text-align:center;color:#84798f;border:1px dashed rgba(255,255,255,.08);border-radius:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full,.cta{grid-column:auto}}</style></head><body><main class="shell"><div class="top"><div class="brand">Snipo Music</div><a href="/admin">← Admin dashboard</a></div><section class="grid"><div class="panel"><div class="eyebrow">Catalog manager</div><h1>Add music</h1><div class="sub">Upload tracks you own or are licensed to use commercially. Snipo keeps licensing metadata with every track.</div><form id="form" class="form"><div class="field full"><label>AUDIO FILE</label><input id="audio" name="audio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" required></div><div class="field"><label>TITLE</label><input name="title" placeholder="Midnight Drive"></div><div class="field"><label>ARTIST</label><input name="artist" placeholder="Nova Beats"></div><div class="field"><label>GENRE</label><input name="genre" placeholder="Lo-fi, Hip-hop, Cinematic"></div><div class="field"><label>MOOD</label><input name="mood" placeholder="chill, energetic, dramatic"></div><div class="field"><label>ENERGY</label><select name="energy"><option value="">Auto / unknown</option><option>low</option><option>medium</option><option>high</option></select></div><div class="field"><label>BPM</label><input name="bpm" type="number" min="40" max="240" step="1" placeholder="124"></div><div class="field"><label>LANGUAGE</label><input name="language" placeholder="instrumental / en / hi"></div><div class="field"><label>LICENSE TYPE</label><select name="licenseType"><option value="owned">Owned</option><option value="cc0">CC0</option><option value="cc-by">CC BY</option><option value="royalty-free">Royalty-free</option><option value="partner">Partner license</option></select></div><div class="field full"><label>LICENSE / SOURCE URL</label><input name="licenseUrl" placeholder="https://..."></div><div class="field full"><label>ATTRIBUTION</label><input name="attribution" placeholder="Creator name / required attribution"></div><div class="field full"><label>TAGS</label><input name="tags" placeholder="travel, vlog, fitness, tech, motivational"></div><div class="checks field full"><label><input name="instrumental" type="checkbox" checked value="1"> Instrumental</label><label><input name="vocals" type="checkbox" value="1"> Vocals</label><label><input name="commercialUse" type="checkbox" checked value="1"> Commercial use cleared</label><label><input name="featured" type="checkbox" value="1"> Featured</label></div><button class="cta" id="upload" type="submit">Upload to Snipo Music</button></form><div id="notice" class="notice"></div></div><div class="panel"><div class="eyebrow">Your library</div><h2>Music catalog</h2><div class="sub">These tracks appear in the Reel Composer search picker for signed-in users.</div><div class="tools"><input id="q" placeholder="Filter title, artist, mood or genre"><span class="count" id="count"></span></div><div id="list" class="list"><div class="empty">Loading catalog…</div></div></div></section></main><script>const $=s=>document.querySelector(s);let tracks=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t,ok=true){const n=$('#notice');n.textContent=t;n.className='notice on '+(ok?'ok':'err')}async function api(url,opt){const r=await fetch(url,Object.assign({credentials:'include'},opt||{}));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}async function load(){try{tracks=(await api('/api/music/admin/tracks')).tracks||[];draw()}catch(e){$('#list').innerHTML='<div class="empty">Admin session required. <a href="/admin" style="color:#d88cff">Sign in to admin</a> first.</div>'}}function draw(){const q=$('#q').value.trim().toLowerCase();const rows=q?tracks.filter(t=>[t.title,t.artist,t.genre,t.mood,(t.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)):tracks;$('#count').textContent=rows.length+' tracks';$('#list').innerHTML=rows.length?rows.map(t=>`<div class="row"><div><strong>${esc(t.title)}${t.artist?' · '+esc(t.artist):''}</strong><div class="meta">${[t.genre,t.mood,t.bpm?Math.round(t.bpm)+' BPM':null,t.duration_sec?Math.round(t.duration_sec)+'s':null].filter(Boolean).map(esc).join(' · ')}</div><div class="badges"><span class="badge">${esc(t.license_type)}</span>${t.featured?'<span class="badge">featured</span>':''}${t.instrumental?'<span class="badge">instrumental</span>':''}</div></div><button class="disable" data-id="${esc(t.id)}">Disable</button></div>`).join(''):'<div class="empty">No tracks yet.</div>';document.querySelectorAll('.disable').forEach(b=>b.onclick=async()=>{if(!confirm('Disable this track from the user library?'))return;try{await api('/api/music/admin/tracks/'+b.dataset.id,{method:'DELETE'});await load()}catch(e){alert(e.message)}})}$('#q').oninput=draw;$('#form').onsubmit=async e=>{e.preventDefault();const f=$('#audio').files[0];if(!f)return note('Choose an audio file.',false);const fd=new FormData(e.target);['instrumental','vocals','commercialUse','featured'].forEach(k=>{if(!fd.has(k))fd.set(k,'0')});const b=$('#upload');b.disabled=true;b.textContent='Uploading…';try{await api('/api/music/admin/tracks',{method:'POST',body:fd});note('Track added to Snipo Music.');e.target.reset();e.target.querySelector('[name=instrumental]').checked=true;e.target.querySelector('[name=commercialUse]').checked=true;await load()}catch(err){note(err.message,false)}finally{b.disabled=false;b.textContent='Upload to Snipo Music'}};load();</script></body></html>
